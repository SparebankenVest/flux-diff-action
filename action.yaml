---
name: 'Flux diff'
description: 'Run flux diff to see what changes would be applied to the cluster'
author: 'SPV'
inputs:
  path-filter:
    description: "Path to filter the flux diff. Comma separated string. E.g. 'some/path1,**/path2/*'"
    required: true
    default: "."
  autodetect-ignore-tenants:
    description: >-
      Enable autodetect Flux tenants to ignore in the flux diff. It will look for
      new sync.yaml files in /tenant folder and assumes the sync.yaml contains a
      `apiVersion: kustomize.toolkit.fluxcd.io/v1 kind: Kustomization` object.
      The name of that object is used as tenant name.
    required: false
    default: "true"
  additional-ignore-tenants:
    description: "Flux tenants to ignore in the flux diff. Comma separated string. E.g. 'tenant1,tenant2'"
    required: false
    default: ""
  additional-ingore-tenants:
    description: >-
      Deprecated alias for additional-ignore-tenants. Flux tenants to ignore in
      the flux diff, as a comma-separated string.
    required: false
    default: ""
outputs:
  diff-output:
    description: "Flux diff output"
    value: ${{ steps.set-output.outputs.diff-output }}
runs:
  using: "composite"
  steps:
    - name: Setup YQ
      run: |
        sudo curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
        sudo chmod +x /usr/local/bin/yq
      shell: bash
    - name: Setup Flux CLI
      uses: fluxcd/flux2/action@main
    - name: Set GitHub Path
      run: echo "$GITHUB_ACTION_PATH" >> $GITHUB_PATH
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
    - name: Run flux-diff.sh
      id: run-flux-diff
      # Genuine failures now write their captured flux output into
      # diff-output.txt before flux-diff.sh exits 1 (see flux-diff.sh). We
      # continue-on-error here so the "Set diff output" step below still runs
      # and exposes that content via the `diff-output` output/PR comment,
      # instead of the job stopping with only a generic banner in the logs.
      continue-on-error: true
      run: |
        ${{ github.action_path }}/flux-diff.sh
      shell: bash
      env:
        PATH_FILTER: ${{ inputs.path-filter }}
        AUTODETECT_IGNORE_TENANTS: ${{ inputs.autodetect-ignore-tenants }}
        IGNORE_TENANTS: ${{ inputs.additional-ignore-tenants || inputs.additional-ingore-tenants }}
    - name: Set diff output as action output
      shell: bash
      id: set-output
      if: always()
      run: |
        # diff-output.txt may not exist if flux-diff.sh failed before ever
        # creating it (e.g. a missing required tool). Fall back to a message
        # rather than letting `cat` fail this step.
        DIFF_OUTPUT=$(cat diff-output.txt 2>/dev/null || echo "flux-diff.sh failed before producing diff output. Check the 'Run flux-diff.sh' step logs.")
        # Use a randomized heredoc delimiter rather than a fixed "EOF". Genuine
        # flux-diff failure text is now unpredictable, attacker/error-controlled
        # content; a fixed delimiter is an output-injection primitive if that
        # content ever happens to contain a line exactly matching it.
        delim="ghadelim_$(openssl rand -hex 8)"
        echo "diff-output<<$delim" >> $GITHUB_OUTPUT
        echo "$DIFF_OUTPUT" >> $GITHUB_OUTPUT
        echo "$delim" >> $GITHUB_OUTPUT
    - name: Fail if flux-diff.sh failed
      shell: bash
      if: steps.run-flux-diff.outcome == 'failure'
      run: |
        echo "flux-diff.sh reported a genuine error; see the 'Run flux-diff.sh' step output above and the diff-output action output for details." >&2
        exit 1
